  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas {

<body>
<div id="wrap"><canvas id="c" aria-label="테트리스 게임 화면"></canvas></div>
<script>
(() => {
'use strict';

// ===== 상수 =====
const W = 480, H = 720, HUD_H = 52;           // 논리 해상도 (세로형)
const COLS = 10, ROWS = 20, HIDDEN = 2, TOTAL = ROWS + HIDDEN;   // 위 2줄은 보이지 않는 생성 영역
const CELL = 28;
const BX = 16, BY = HUD_H + 12;               // 보드 왼쪽 위 (보이는 영역 기준)
const BW = COLS * CELL, BH = ROWS * CELL;
const SX = BX + BW + 14, SW = W - SX - 14;    // 오른쪽 패널
const CTRL_Y = BY + BH + 10;                  // 하단 조작 영역
const DAS = 0.16, ARR = 0.035;                // 좌우 키 누르고 있을 때: 반복 시작 지연 / 반복 간격
const SOFT_RATE = 0.03;                       // 소프트 드롭 속도 (초/칸)
const LOCK_DELAY = 0.5, MAX_RESETS = 15;      // 바닥 닿은 뒤 고정까지 유예, 유예 리셋 최대 횟수
const CLEAR_TIME = 0.32;                      // 줄 삭제 연출 시간
const FONT = 'system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const params = new URLSearchParams(location.search);
const AUTO = params.has('auto');              // 테스트용 자동 플레이 (?auto)
const TIME_SCALE = AUTO ? Math.max(1, Math.min(8, +params.get('ts') || 1)) : 1;
const isTouch = matchMedia('(pointer: coarse)').matches;

// ===== 캔버스 / 해상도 대응 =====
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize);
resize();

// ===== 유틸 =====
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(str, x, y, size, color = '#fff', weight = '700', align = 'center', maxW = 0) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  if (maxW) {                                 // 폭을 넘으면 글자 크기를 줄여서 맞춤
    while (size > 8 && ctx.measureText(str).width > maxW) { size--; ctx.font = `${weight} ${size}px ${FONT}`; }
  }
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const inRect = (p, r, pad = 0) => p.x >= r.x - pad && p.x <= r.x + r.w + pad && p.y >= r.y - pad && p.y <= r.y + r.h + pad;

// ===== 사운드 =====
let actx = null;
let muted = store.get('arcade.tetris.muted', false);
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'square', vol = 0.05, slideTo = null, delay = 0) {
  if (muted || !actx) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  move:   () => tone(240, 0.025, 'square', 0.018),
  rotate: () => tone(480, 0.04, 'square', 0.025),
  lock:   () => tone(150, 0.06, 'triangle', 0.07),
  drop:   () => tone(120, 0.09, 'triangle', 0.09, 60),
  hold:   () => tone(660, 0.07, 'sine', 0.05, 880),
  clear:  (n) => [523, 659, 784].slice(0, n).forEach((f, i) => tone(f, 0.12, 'square', 0.045, null, i * 0.06)),
  big:    () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.14, 'square', 0.05, null, i * 0.07)),
  level:  () => [392, 523, 659, 784].forEach((f, i) => tone(f, 0.12, 'triangle', 0.07, null, 0.35 + i * 0.08)),
  over:   () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, 'triangle', 0.08, null, i * 0.16)),
};

// ===== 테트로미노 / SRS =====
const COLORS = { I: '#4dd0e1', O: '#ffd166', T: '#b07cff', S: '#3ddc97', Z: '#ff4d6d', J: '#4d7cff', L: '#ff8a3d' };
const SHAPES = {                              // [x, y] (y는 아래로 증가), n = 회전 박스 크기
  I: { n: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]] },
  O: { n: 4, cells: [[1, 0], [2, 0], [1, 1], [2, 1]] },
  T: { n: 3, cells: [[1, 0], [0, 1], [1, 1], [2, 1]] },
  S: { n: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]] },
  Z: { n: 3, cells: [[0, 0], [1, 0], [1, 1], [2, 1]] },
  J: { n: 3, cells: [[0, 0], [0, 1], [1, 1], [2, 1]] },
  L: { n: 3, cells: [[2, 0], [0, 1], [1, 1], [2, 1]] },
};
const ROT = {};                               // ROT[type][0..3] = 회전 상태별 칸 좌표 (0, R, 2, L)
for (const k in SHAPES) {
  const s = SHAPES[k];
  ROT[k] = [s.cells];
  for (let r = 1; r < 4; r++) {
    const prev = ROT[k][r - 1];
    ROT[k].push(k === 'O' ? prev : prev.map(([x, y]) => [s.n - 1 - y, x]));   // 시계방향 90°
  }
}
// SRS 월킥 표 (가이드라인 표기: y는 위가 +), 적용할 때 y 부호를 뒤집는다
const KICKS = {
  '01': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
  '10': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
  '12': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
  '21': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
  '23': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
  '32': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
  '30': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
  '03': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
};
const KICKS_I = {
  '01': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
  '10': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
  '12': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
  '21': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
  '23': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
  '32': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
  '30': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
  '03': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
};

// ===== 게임 상태 =====
let state = 'title', stateT = 0;              // title | play | paused | over
let board = decoBoard(), cur = null, holdType = null, holdUsed = false, queue = [];
let score = 0, lines = 0, level = 1, combo = -1, b2b = false, newBest = false;
let best = store.get('arcade.tetris.best', 0);
let fallT = 0, lockT = 0, resets = 0, lowestY = 0, lastRotate = false, lastKick = 0;
let clearing = null, lockFlash = null, bannerT = 0, shake = 0, time = 0;
let parts = [], pops = [], actions = [];
let dasDir = 0, dasT = 0, arrT = 0, pieceCount = 0, autoT = 0;
const keys = {}, btnHeld = { left: false, right: false, down: false };

function emptyBoard() { return Array.from({ length: TOTAL }, () => Array(COLS).fill(null)); }
function decoBoard() {                        // 타이틀 화면 배경용 랜덤 스택
  const b = emptyBoard(), types = Object.keys(COLORS);
  for (let y = TOTAL - 7; y < TOTAL; y++) {
    const gap = Math.floor(Math.random() * COLS);
    for (let x = 0; x < COLS; x++) if (x !== gap && Math.random() < 0.85) b[y][x] = types[(x * 7 + y * 3) % 7];
  }
  return b;
}
function setState(s) { state = s; stateT = 0; }
function refill() {                           // 7-bag: 7종을 섞어서 한 묶음씩
  const bag = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
  for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
  queue.push(...bag);
}
function takeNext() { if (queue.length < 7) refill(); return queue.shift(); }
function collide(type, rot, x, y) {
  for (const [cx, cy] of ROT[type][rot]) {
    const bx = x + cx, by = y + cy;
    if (bx < 0 || bx >= COLS || by >= TOTAL) return true;
    if (by >= 0 && board[by][bx]) return true;
  }
  return false;
}
const grounded = () => collide(cur.type, cur.rot, cur.x, cur.y + 1);
function gravityTime() { return Math.pow(Math.max(0.8 - (level - 1) * 0.007, 0.01), level - 1); }   // 가이드라인 낙하 속도
function placePiece(type) {
  cur = { type, rot: 0, x: 3, y: 0 };
  fallT = 0; lockT = 0; resets = 0; lastRotate = false; lastKick = 0;
  if (collide(type, 0, cur.x, cur.y)) { gameOver(); return false; }   // 생성 자리가 막힘 = 게임 오버
  if (!collide(type, 0, cur.x, 1)) cur.y = 1;   // 생성 직후 한 칸 내려서 보이게
  lowestY = cur.y;
  return true;
}
function spawn() { pieceCount++; holdUsed = false; placePiece(takeNext()); }
function newGame() {
  board = emptyBoard(); queue = []; holdType = null;
  score = 0; lines = 0; level = 1; combo = -1; b2b = false; newBest = false;
  parts = []; pops = []; actions = []; clearing = null; lockFlash = null; pieceCount = 0; dasDir = 0;
  setState('play');
  spawn();
}
function gameOver() {
  cur = null; clearing = null;
  if (score > best && !AUTO) { best = score; newBest = true; store.set('arcade.tetris.best', best); }   // 자동 플레이 점수는 저장 안 함
  sfx.over();
  setState('over');
}
function onManip() {                          // 바닥에서 움직이면 고정 유예 리셋 (최대 15회)
  if (grounded() && resets < MAX_RESETS) { lockT = 0; resets++; }
}
function tryMove(dx, quiet) {
  if (!cur || clearing || collide(cur.type, cur.rot, cur.x + dx, cur.y)) return false;
  cur.x += dx; lastRotate = false;
  onManip();
  if (!quiet) sfx.move();
  return true;
}
function tryRotate(dir) {                     // dir: +1 시계, -1 반시계
  if (!cur || clearing || cur.type === 'O') return false;
  const from = cur.rot, to = (from + dir + 4) % 4;
  const kicks = (cur.type === 'I' ? KICKS_I : KICKS)[`${from}${to}`];
  for (let i = 0; i < kicks.length; i++) {
    const [kx, ky] = kicks[i];
    if (!collide(cur.type, to, cur.x + kx, cur.y - ky)) {
      cur.x += kx; cur.y -= ky; cur.rot = to;
      lastRotate = true; lastKick = i;
      if (cur.y > lowestY) { lowestY = cur.y; resets = 0; lockT = 0; }
      onManip();
      sfx.rotate();
      return true;
    }
  }
  return false;
}
function softStep() {                         // 한 칸 소프트 드롭 (+1점)
  if (!cur || clearing || grounded()) return false;
  cur.y++; score += 1; lastRotate = false; fallT = 0;
  if (cur.y > lowestY) { lowestY = cur.y; resets = 0; lockT = 0; }
  return true;
}
function ghostY() { let y = cur.y; while (!collide(cur.type, cur.rot, cur.x, y + 1)) y++; return y; }
function hardDrop() {
  if (state !== 'play' || !cur || clearing) return;
  let d = 0;
  while (!grounded()) { cur.y++; d++; }
  if (d) lastRotate = false;
  score += d * 2;
  sfx.drop();
  shake = Math.max(shake, 0.08);
  for (const [cx, cy] of ROT[cur.type][cur.rot]) {
    const px = BX + (cur.x + cx + 0.5) * CELL, py = BY + (cur.y + cy - HIDDEN + 1) * CELL;
    for (let i = 0; i < 2; i++) parts.push({ x: px, y: py, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 120, life: 0.35, max: 0.35, color: COLORS[cur.type], size: 3 });
  }
  lockPiece();
}
function doHold() {
  if (state !== 'play' || !cur || clearing || holdUsed) return;
  const t = cur.type;
  if (holdType) { const h = holdType; holdType = t; placePiece(h); }
  else { holdType = t; pieceCount++; placePiece(takeNext()); }
  holdUsed = true;
  sfx.hold();
}
function detectTSpin() {                      // 3-코너 규칙. 마지막 조작이 회전이어야 함
  if (cur.type !== 'T' || !lastRotate) return null;
  const cx = cur.x + 1, cy = cur.y + 1;
  const occ = (x, y) => x < 0 || x >= COLS || y >= TOTAL || (y >= 0 && !!board[y][x]);
  const filled = [[cx - 1, cy - 1], [cx + 1, cy - 1], [cx + 1, cy + 1], [cx - 1, cy + 1]].map(([x, y]) => occ(x, y));
  if (filled.filter(Boolean).length < 3) return null;
  const [a, b] = [[0, 1], [1, 2], [2, 3], [3, 0]][cur.rot];   // T가 향한 쪽 두 모서리
  return (filled[a] && filled[b]) || lastKick === 4 ? 'full' : 'mini';
}
function addAction(str, color, size = 17) {
  actions.unshift({ str, color, size, life: 2.2 });
  if (actions.length > 4) actions.length = 4;
}
function lockPiece() {
  const cells = ROT[cur.type][cur.rot].map(([cx, cy]) => [cur.x + cx, cur.y + cy]);
  for (const [x, y] of cells) if (y >= 0) board[y][x] = cur.type;
  const tspin = detectTSpin();
  const full = [];
  for (let y = 0; y < TOTAL; y++) if (board[y].every(Boolean)) full.push(y);
  const perfect = full.length > 0 && board.every((row, y) => full.includes(y) || row.every(c => !c));
  const allHidden = cells.every(([, y]) => y < HIDDEN);
  lockFlash = { cells, t: 0.12 };
  scoreClear(full.length, tspin, perfect, cells);
  cur = null;
  if (full.length) {
    clearing = { rows: full, t: 0 };
    for (const y of full) for (let x = 0; x < COLS; x++) {
      const px = BX + (x + 0.5) * CELL, py = BY + (y - HIDDEN + 0.5) * CELL;
      for (let i = 0; i < 2; i++) {
        const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 200;
        parts.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.6, max: 0.6, color: COLORS[board[y][x]], size: 3 + Math.random() * 2 });
      }
    }
  } else {
    sfx.lock();
    if (allHidden) { gameOver(); return; }    // 보이는 영역 밖에서 고정 = 게임 오버
    spawn();
  }
}
function scoreClear(n, tspin, perfect, cells) {
  let pts, label;
  if (tspin === 'full') { pts = [400, 800, 1200, 1600][n]; label = ['T-SPIN', 'T-SPIN SINGLE', 'T-SPIN DOUBLE', 'T-SPIN TRIPLE'][n]; }
  else if (tspin === 'mini') { pts = [100, 200, 400][Math.min(n, 2)]; label = ['MINI T-SPIN', 'MINI T-SPIN SINGLE', 'MINI T-SPIN DOUBLE'][Math.min(n, 2)]; }
  else { pts = [0, 100, 300, 500, 800][n]; label = ['', '', 'DOUBLE', 'TRIPLE', 'TETRIS'][n]; }
  const hard = n === 4 || (!!tspin && n > 0);   // 백투백 대상: 테트리스, 줄 지운 T-스핀
  const tags = [];
  if (n > 0) {
    if (hard && b2b) { pts = Math.floor(pts * 1.5); tags.push(['BACK-TO-BACK', '#ff8a3d']); }
    b2b = hard;
    combo++;
  } else combo = -1;
  let gain = pts * level;
  if (n > 0 && combo > 0) { gain += 50 * combo * level; tags.push([`${combo} COMBO`, '#4dd0e1']); }
  if (perfect) { gain += [800, 1200, 1800, 2000][n - 1] * level; tags.push(['PERFECT CLEAR', '#ffffff']); }
  score += gain;
  for (const [s, c] of tags.reverse()) addAction(s, c, 14);
  if (label) addAction(label, tspin ? '#b07cff' : n === 4 ? '#4dd0e1' : '#ffd166', n === 4 || tspin ? 20 : 17);
  if (gain > 0) {
    const mx = cells.reduce((s, [x]) => s + x, 0) / 4, my = Math.min(...cells.map(([, y]) => y));
    pops.push({ x: BX + (mx + 0.5) * CELL, y: BY + (my - HIDDEN) * CELL, str: '+' + gain, life: 1.1 });
  }
  if (n > 0) {
    if (n === 4 || tspin) { sfx.big(); shake = 0.25; } else sfx.clear(n);
    lines += n;
    const nl = Math.min(20, 1 + Math.floor(lines / 10));   // 10줄마다 레벨업
    if (nl > level) { level = nl; bannerT = 1.4; sfx.level(); }
  } else if (tspin) sfx.big();
}
function finishClear() {
  for (const y of clearing.rows) { board.splice(y, 1); board.unshift(Array(COLS).fill(null)); }
  clearing = null;
  spawn();
}

// ===== 자동 플레이 (테스트용 간단 AI) =====
function aiMove() {
  if (pieceCount % 9 === 4 && !holdUsed) { doHold(); if (!cur || state !== 'play') return; }   // 홀드 경로도 가끔 태움
  let bestP = null;
  for (let rot = 0; rot < 4; rot++) {
    if (cur.type === 'O' && rot > 0) break;
    for (let x = -2; x < COLS; x++) {
      if (collide(cur.type, rot, x, cur.y)) continue;
      let y = cur.y;
      while (!collide(cur.type, rot, x, y + 1)) y++;
      const b = board.map(r => r.slice());
      for (const [cx, cy] of ROT[cur.type][rot]) if (y + cy >= 0) b[y + cy][x + cx] = cur.type;
      const keep = b.filter(r => !r.every(Boolean)), cleared = TOTAL - keep.length;
      while (keep.length < TOTAL) keep.unshift(Array(COLS).fill(null));
      let agg = 0, holes = 0, bump = 0, prev = null;
      for (let cx = 0; cx < COLS; cx++) {

  if (id) { releaseBtn(id); activeBtn.delete(e.pointerId); return; }
  if (gest && e.pointerId === gest.id) {
    const p = toLocal(e), now = performance.now(), h0 = gest.hist[0];
    const dur = Math.max(1, now - gest.t0), dy = p.y - gest.y0;
    const vy = (p.y - h0.y) / Math.max(1, now - h0.t);   // 최근 100ms 세로 속도 (px/ms)
    const flick = (v) => Math.abs(vy) > 0.6 && Math.sign(vy) === v || (dur < 350 && dy * v / dur > 0.45);   // 최근 속도 또는 전체 평균 속도
    if (!gest.moved && dur < 300) rotate(1);
    else if (gest.axis === 'y' && dy > 40 && flick(1)) hardDrop();
    else if (gest.axis === 'y' && dy < -40 && flick(-1)) doHold();
    gest = null;
    return;
  }
  if (tapStart) { tapStart = false; primaryAction(); }
});
addEventListener('pointercancel', e => {
  const id = activeBtn.get(e.pointerId);
  if (id) { releaseBtn(id); activeBtn.delete(e.pointerId); }
  if (gest && e.pointerId === gest.id) gest = null;
});
addEventListener('keydown', e => {
  const c = e.code;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(c)) e.preventDefault();
  audio();
  keys[c] = true;
  if (e.repeat) return;                       // 브라우저 키 반복은 무시하고 자체 DAS 사용
  if (state === 'play') {
    switch (c) {
      case 'ArrowLeft': case 'KeyA': pressDir(-1); break;
      case 'ArrowRight': case 'KeyD': pressDir(1); break;
      case 'ArrowUp': case 'KeyX': case 'KeyW': rotate(1); break;
      case 'KeyZ': case 'ControlLeft': case 'ControlRight': rotate(-1); break;
      case 'Space': hardDrop(); break;
      case 'KeyC': case 'ShiftLeft': case 'ShiftRight': doHold(); break;
    }
  } else if (c === 'Space' || c === 'Enter') primaryAction();
  if (c === 'KeyP' || c === 'Escape') togglePause();
  else if (c === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

// ===== 메인 루프 =====
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (state !== 'paused') for (let i = 0; i < TIME_SCALE; i++) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 읽기 전용 상태 노출 (테스트용)
window.__tetris = {
  get state() { return state; }, get score() { return score; }, get lines() { return lines; }, get level() { return level; },
  get combo() { return combo; }, get b2b() { return b2b; }, get pieces() { return pieceCount; }, get hold() { return holdType; },
  get actions() { return actions.map(a => a.str); },
};
if (params.has('debug')) window.__tdbg = {   // 회전·T-스핀 검증용 (?debug)
  start: () => newGame(),
  setBoard(rows) { board = emptyBoard(); rows.forEach((r, i) => { const y = TOTAL - rows.length + i; for (let x = 0; x < COLS; x++) board[y][x] = r[x] === '#' ? 'Z' : null; }); },
  setPiece(type, rot, x, y) { cur = { type, rot, x, y }; lowestY = y; lockT = 0; resets = 0; lastRotate = false; },
  rotate: d => tryRotate(d), move: d => tryMove(d), drop: () => hardDrop(),
  get cur() { return cur && { ...cur }; },
  get board() { return board.map(r => r.map(c => c || '.').join('')); },
};
})();
</script>
