<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Arcade — 브라우저 미니 게임</title>
<meta name="description" content="설치 없이 브라우저에서 바로 하는 미니 아케이드 게임 모음. 테트리스, 벽돌깨기.">
<meta property="og:type" content="website">
<meta property="og:title" content="Arcade — 브라우저 미니 게임">
<meta property="og:description" content="설치 없이 브라우저에서 바로 하는 미니 아케이드 게임 모음. 테트리스, 벽돌깨기.">
<meta property="og:image" content="https://leebong-su.github.io/arcade/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='13' height='7' rx='2' fill='%23ff6b8b'/%3E%3Crect x='17' y='4' width='13' height='7' rx='2' fill='%23ffd166'/%3E%3Crect x='2' y='13' width='13' height='7' rx='2' fill='%234dd0e1'/%3E%3Ccircle cx='22' cy='18' r='3' fill='%23fff'/%3E%3Crect x='9' y='25' width='14' height='4' rx='2' fill='%237ee8fa'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; color: #e6e9f0;
    background: radial-gradient(circle at 50% -10%, #1a2442 0%, #0b0f1a 55%) fixed, #0b0f1a;
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px 40px; }
  h1 {
    margin: 0; font-size: 64px; font-weight: 900; letter-spacing: 6px;
    background: linear-gradient(90deg, #ff6b8b, #ffd166 50%, #4dd0e1);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: #7f8db0; margin: 8px 0 36px; font-size: 16px; }
  .grid { display: grid; gap: 18px; }
  .card {
    display: flex; gap: 20px; align-items: center; padding: 16px; border-radius: 16px;
    background: #0e1424; border: 1px solid #1f2a44; text-decoration: none; color: inherit;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: #3a4d7a; box-shadow: 0 12px 30px rgba(0, 0, 0, .4); }
  .card img { width: 120px; height: 180px; border-radius: 10px; object-fit: cover; flex: none; background: #0a0f1c; }
  .body { flex: 1; min-width: 0; }
  .card h2 { margin: 0 0 6px; font-size: 24px; }
  .card p { margin: 0 0 12px; color: #aab4cc; line-height: 1.55; font-size: 15px; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .tag { padding: 3px 10px; border-radius: 999px; background: #151d33; color: #cfd6e6; }
  .tag.new { background: #3a2a10; color: #ffd166; font-weight: 800; }
  .best { color: #ffd166; font-weight: 700; }
  .play { color: #4dd0e1; font-weight: 800; font-size: 22px; padding: 0 6px; }
  footer { margin-top: 40px; color: #5d6b8a; font-size: 13px; text-align: center; }
  footer a { color: #7f8db0; }
  @media (max-width: 520px) {
    main { padding-top: 36px; }
    h1 { font-size: 46px; }
    .card { gap: 14px; padding: 12px; }
    .card img { width: 92px; height: 138px; }
    .card h2 { font-size: 20px; }
    .card p { font-size: 14px; }
    .play { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1>ARCADE</h1>
  <p class="sub">설치 없이 브라우저에서 바로 하는 미니 게임</p>
  <div class="grid">
    <a class="card" href="tetris/">
      <img src="tetris/thumb.png" alt="테트리스 플레이 화면">
      <div class="body">
        <h2>테트리스</h2>
        <p>SRS 회전, 홀드, 고스트, T-스핀까지 갖춘 정통 테트리스. 10줄마다 빨라진다.</p>
        <div class="meta"><span class="tag new">NEW</span><span class="tag">키보드</span><span class="tag">터치</span><span class="best" data-key="arcade.tetris.best"></span></div>
      </div>
      <span class="play">▶</span>
    </a>
    <a class="card" href="breakout/">
      <img src="breakout/thumb.png" alt="벽돌깨기 플레이 화면">
      <div class="body">
        <h2>벽돌깨기</h2>
        <p>파워업 5종과 끝없이 이어지는 레벨. 마우스·터치·키보드 다 된다.</p>
        <div class="meta"><span class="tag">마우스</span><span class="tag">터치</span><span class="tag">키보드</span><span class="best" data-key="arcade.breakout.best"></span></div>
      </div>
      <span class="play">▶</span>
    </a>
  </div>
  <footer><a href="https://github.com/LeeBong-Su/arcade">GitHub · LeeBong-Su/arcade</a></footer>
</main>
<script>
// 각 게임 최고 점수 표시 (같은 도메인 localStorage 공유)
document.querySelectorAll('[data-key]').forEach(el => {
  try { const v = JSON.parse(localStorage.getItem(el.dataset.key)); if (v) el.textContent = '최고 ' + Number(v).toLocaleString(); } catch (e) {}
});
</script>
</body>
</html>
